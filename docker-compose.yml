services:
  phoenix-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_started
    environment:
      - MONGO_URI=mongodb://mongo:27017/phoenixDB
      - JWT_SECRET=${JWT_SECRET:-phoenix_docker_secret_change_me}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHON_EXE=python3
      - PORT=3000
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
